[package]
name = "tableX"
version = "0.0.1"
edition = "2024"

[lib]
name = "tablex"
path = "src/lib.rs"

[dependencies]
gpui-kit = "0.6.6"
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs = "6"
futures-util = "0.3"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring", "native-certs"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"

[features]
perf-overlay = ["gpui-kit/profiler"]

[dev-dependencies]
gpui-kit = { version = "0.6.6", features = ["test-support"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
